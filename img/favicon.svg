<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- isometric cube: top, left, right faces -->
  <polygon points="32,6 56,19 32,32 8,19" fill="#c9d3e6" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="8,19 32,32 32,60 8,47" fill="#5b7bb5" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="56,19 32,32 32,60 56,47" fill="#2f4c85" stroke="#1f2a44" stroke-width="2" stroke-linejoin="round"/>
  <!-- mesh lines -->
  <g stroke="#1f2a44" stroke-width="1" fill="none" opacity="0.7">
    <polyline points="20,12.5 44,25.5"/><polyline points="44,12.5 20,25.5"/>
    <polyline points="8,33 32,46"/><polyline points="20,25.5 20,53.5"/>
    <polyline points="56,33 32,46"/><polyline points="44,25.5 44,53.5"/>
  </g>
</svg>
